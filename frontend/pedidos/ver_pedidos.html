<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Pedidos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);}
    .navbar-brand{font-weight:700;font-size:1.7rem;}
    .hero-card,.content-card{border:none;border-radius:20px;box-shadow:0 12px 28px rgba(0,0,0,0.1);}
    .hero-card{overflow:hidden;margin-top:28px;}
    .hero-img{width:100%;height:260px;object-fit:cover;}
    .pedido-card{
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:18px;
      margin-bottom:18px;
      background:#fff;
      box-shadow:0 6px 16px rgba(0,0,0,0.05);
    }
    .badge-servicio{
      background:#e0f2fe;
      color:#0369a1;
      border-radius:999px;
      padding:6px 10px;
      display:inline-block;
      margin:4px 6px 0 0;
      font-size:.9rem;
    }
    .estado-badge{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      font-size:.85rem;
      font-weight:600;
      margin-bottom:12px;
    }
    .estado-proceso{background:#fff7ed;color:#c2410c;}
    .estado-confirmado{background:#ecfdf5;color:#15803d;}
    .estado-rechazado{background:#fef2f2;color:#b91c1c;}
    .info-pago{
      background:#f8fafc;
      border:1px solid #dbe3ef;
      border-radius:12px;
      padding:12px;
      margin-top:12px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVerPedidos">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarVerPedidos">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="ver_pedidos.html">Ver Pedidos</a></li>
        <li class="nav-item"><a class="nav-link" href="insertar_pedido.html">Crear Pedido</a></li>
        <li class="nav-item"><a class="nav-link" href="consultar_pedido.html">Consultar</a></li>
        <li class="nav-item"><a class="nav-link" href="editar_pedido.html">Editar</a></li>
        <li class="nav-item"><a class="nav-link" href="borrar_pedido.html">Eliminar</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="hero-card">
    <img src="../imagenes/banner_audio.jpg" alt="Banner" class="hero-img">
    <div class="p-4 text-center bg-white">
      <h2>Lista de Pedidos</h2>
      <p class="text-muted mb-0">Visualiza todos los pedidos registrados y los servicios contratados.</p>
    </div>
  </div>

  <div class="content-card bg-white mt-4 p-4">
    <div id="contenedor-pedidos"></div>
    <div id="mensaje" class="alert alert-danger d-none mt-3"></div>
    <div class="text-center mt-4">
      <a href="index.html" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>

<script>
  function renderServicios(servicios) {
    if (!Array.isArray(servicios)) return '';
    return servicios.map(s => `<span class="badge-servicio">${s.nombre} - $${Number(s.precio).toLocaleString('es-CO')}</span>`).join('');
  }

  function obtenerClaseEstado(estado) {
    if (estado === 'Confirmado') return 'estado-confirmado';
    if (estado === 'Rechazado') return 'estado-rechazado';
    return 'estado-proceso';
  }

  // Aqui se define la regla de negocio numero 11, que consiste en mostrar trazabilidad visible del pedido en frontend.
  fetch('/api/pedidos/api/pedidos')
    .then(res => res.json())
    .then(data => {
      const contenedor = document.getElementById('contenedor-pedidos');

      if (!Array.isArray(data) || data.length === 0) {
        contenedor.innerHTML = '<p class="text-center text-muted">No hay pedidos registrados.</p>';
        return;
      }

      data.forEach(pedido => {
        const div = document.createElement('div');
        div.className = 'pedido-card';
        div.innerHTML = `
          <h5 class="fw-bold">Pedido #${pedido.id}</h5>
          <span class="estado-badge ${obtenerClaseEstado(pedido.estado_pedido)}">${pedido.estado_pedido || 'En proceso'}</span>
          <p class="mb-1"><strong>Cliente:</strong> ${pedido.nombre_cliente}</p>
          <p class="mb-1"><strong>Email:</strong> ${pedido.email_cliente}</p>
          <p class="mb-1"><strong>Fecha:</strong> ${pedido.fecha}</p>
          <p class="mb-2"><strong>Servicios seleccionados:</strong></p>
          <div>${renderServicios(pedido.servicios_seleccionados)}</div>
          <hr>
          <p class="mb-0"><strong>Total:</strong> $${Number(pedido.precio_total).toLocaleString('es-CO')}</p>

          <div class="info-pago">
            <p class="mb-1"><strong>Intentos de pago:</strong> ${pedido.cantidad_intentos_pago || 0}</p>
            <p class="mb-1"><strong>Último estado de pago:</strong> ${pedido.ultimo_estado_pago || 'Sin intentos'}</p>
            <p class="mb-0"><strong>Último pago registrado:</strong> ${pedido.ultimo_pago_id || 'N/A'}</p>
          </div>
        `;
        contenedor.appendChild(div);
      });
    })
    .catch(error => {
      const mensaje = document.getElementById('mensaje');
      mensaje.classList.remove('d-none');
      mensaje.textContent = 'Error al cargar los pedidos';
      console.error(error);
    });
  // Hasta aqui llega el codigo de la regla de negocio numero 11.
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
