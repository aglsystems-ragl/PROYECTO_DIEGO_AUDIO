<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);}
    .navbar-brand{font-weight:700;font-size:1.7rem;}
    .hero-card,.content-card{border:none;border-radius:20px;box-shadow:0 12px 28px rgba(0,0,0,0.1);}
    .hero-card{overflow:hidden;margin-top:28px;}
    .hero-img{width:100%;height:260px;object-fit:cover;}
    .table thead th{vertical-align:middle;}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVerClientes">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarVerClientes">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="ver_clientes.html">Ver Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="insertar_cliente.html">Insertar</a></li>
        <li class="nav-item"><a class="nav-link" href="consultar_cliente.html">Consultar</a></li>
        <li class="nav-item"><a class="nav-link" href="editar_cliente.html">Editar</a></li>
        <li class="nav-item"><a class="nav-link" href="borrar_cliente.html">Eliminar</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="hero-card">
    <img src="../imagenes/banner_audio.jpg" alt="Banner" class="hero-img">
    <div class="p-4 text-center bg-white">
      <h2>Listado General de Clientes</h2>
      <p class="text-muted mb-0">Visualiza todos los clientes registrados con sus datos principales.</p>
    </div>
  </div>

  <div class="content-card bg-white mt-4 p-4">
    <div class="table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Tipo Doc.</th>
            <th>Número Documento</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody id="tabla-clientes"></tbody>
      </table>
    </div>

    <div id="mensaje" class="alert alert-danger d-none mt-3"></div>

    <div class="text-center mt-4">
      <a href="index.html" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>

<script>
  fetch('/api/clientes/api/clientes')
    .then(response => response.json())
    .then(data => {
      const tabla = document.getElementById('tabla-clientes');

      data.forEach(cliente => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${cliente.id}</td>
          <td>${cliente.tipo_documento}</td>
          <td>${cliente.numero_documento}</td>
          <td>${cliente.nombre}</td>
          <td>${cliente.direccion}</td>
          <td>${cliente.telefono}</td>
          <td>${cliente.email}</td>
        `;
        tabla.appendChild(fila);
      });
    })
    .catch(error => {
      const mensaje = document.getElementById('mensaje');
      mensaje.classList.remove('d-none');
      mensaje.textContent = 'Error al cargar los clientes';
      console.error(error);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
