<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insertar Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);}
    .navbar-brand{font-weight:700;font-size:1.7rem;}
    .hero-card,.content-card{border:none;border-radius:20px;box-shadow:0 12px 28px rgba(0,0,0,0.1);}
    .hero-card{overflow:hidden;margin-top:28px;}
    .hero-img{width:100%;height:250px;object-fit:cover;}
    .form-control,.form-select{border-radius:12px;}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarInsertarCliente">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarInsertarCliente">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="ver_clientes.html">Ver Clientes</a></li>
        <li class="nav-item"><a class="nav-link active" href="insertar_cliente.html">Insertar</a></li>
        <li class="nav-item"><a class="nav-link" href="consultar_cliente.html">Consultar</a></li>
        <li class="nav-item"><a class="nav-link" href="editar_cliente.html">Editar</a></li>
        <li class="nav-item"><a class="nav-link" href="borrar_cliente.html">Eliminar</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="hero-card">
    <img src="../imagenes/insertar_cliente.jpg" alt="Insertar cliente" class="hero-img">
    <div class="p-4 text-center bg-white">
      <h2>Registrar Nuevo Cliente</h2>
      <p class="text-muted mb-0">Crea clientes con datos personales, de contacto y facturación.</p>
    </div>
  </div>

  <div class="content-card bg-white mt-4 p-4">
    <form id="cliente-form">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Tipo de documento</label>
          <select id="tipo_documento" class="form-select" required>
            <option value="">Seleccione...</option>
            <option value="CC">Cédula de ciudadanía (CC)</option>
            <option value="TI">Tarjeta de identidad (TI)</option>
            <option value="NUIP">NUIP</option>
            <option value="CE">Cédula de extranjería (CE)</option>
            <option value="PAS">Pasaporte (PAS)</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Número de documento</label>
          <input type="text" id="numero_documento" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Nombre completo</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Dirección</label>
          <input type="text" id="direccion" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Teléfono</label>
          <input type="text" id="telefono" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" required>
        </div>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-success">Guardar cliente</button>
        <a href="index.html" class="btn btn-secondary ms-2">Volver</a>
      </div>
    </form>

    <div id="mensaje" class="alert mt-4 d-none"></div>
  </div>
</div>

<script>
  document.getElementById('cliente-form').addEventListener('submit', function(e){
    e.preventDefault();

    const cliente = {
      tipo_documento: document.getElementById('tipo_documento').value,
      numero_documento: document.getElementById('numero_documento').value,
      nombre: document.getElementById('nombre').value,
      direccion: document.getElementById('direccion').value,
      telefono: document.getElementById('telefono').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };

    fetch('/api/clientes/api/clientes', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(cliente)
    })
    .then(response => response.json())
    .then(data => {
      const mensaje = document.getElementById('mensaje');
      if (data.error) {
        throw new Error(data.error);
      }
      mensaje.className = 'alert alert-success mt-4';
      mensaje.textContent = 'Cliente creado con éxito';
      mensaje.classList.remove('d-none');
      document.getElementById('cliente-form').reset();
    })
    .catch(error => {
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'alert alert-danger mt-4';
      mensaje.textContent = 'Error al crear el cliente';
      mensaje.classList.remove('d-none');
      console.error(error);
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
