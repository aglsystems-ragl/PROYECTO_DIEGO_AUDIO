<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);}
    .navbar-brand{font-weight:700;font-size:1.7rem;}
    .hero-card,.content-card{border:none;border-radius:20px;box-shadow:0 12px 28px rgba(0,0,0,0.1);}
    .hero-card{overflow:hidden;margin-top:28px;}
    .hero-img{width:100%;height:250px;object-fit:cover;}
    .form-control,.form-select{border-radius:12px;}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarEditarCliente">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarEditarCliente">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="ver_clientes.html">Ver Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="insertar_cliente.html">Insertar</a></li>
        <li class="nav-item"><a class="nav-link" href="consultar_cliente.html">Consultar</a></li>
        <li class="nav-item"><a class="nav-link active" href="editar_cliente.html">Editar</a></li>
        <li class="nav-item"><a class="nav-link" href="borrar_cliente.html">Eliminar</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="hero-card">
    <img src="../imagenes/editar_cliente.jpg" alt="Editar cliente" class="hero-img">
    <div class="p-4 text-center bg-white">
      <h2>Editar Cliente</h2>
      <p class="text-muted mb-0">Selecciona un cliente, carga su información y actualízala.</p>
    </div>
  </div>

  <div class="content-card bg-white mt-4 p-4">
    <form id="buscar-form" class="mb-4">
      <label class="form-label">Seleccione un cliente</label>
      <select id="id_cliente" class="form-select mb-3" required>
        <option value="">Cargando clientes...</option>
      </select>
      <button type="submit" class="btn btn-primary">Cargar datos</button>
    </form>

    <form id="editar-form" class="d-none">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Tipo de documento</label>
          <select id="tipo_documento" class="form-select" required>
            <option value="CC">Cédula de ciudadanía (CC)</option>
            <option value="TI">Tarjeta de identidad (TI)</option>
            <option value="NUIP">NUIP</option>
            <option value="CE">Cédula de extranjería (CE)</option>
            <option value="PAS">Pasaporte (PAS)</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Número de documento</label>
          <input type="text" id="numero_documento" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Nombre completo</label>
          <input type="text" id="nombre" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Dirección</label>
          <input type="text" id="direccion" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Teléfono</label>
          <input type="text" id="telefono" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Contraseña</label>
          <input type="text" id="password" class="form-control" required>
        </div>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-success">Guardar cambios</button>
        <a href="index.html" class="btn btn-secondary ms-2">Volver</a>
      </div>
    </form>

    <div id="mensaje" class="alert mt-4 d-none"></div>
  </div>
</div>

<script>
  let clienteId = null;
  const selectCliente = document.getElementById('id_cliente');

  fetch('/api/clientes/api/clientes')
    .then(res => res.json())
    .then(data => {
      selectCliente.innerHTML = '<option value="">Seleccione un cliente...</option>';
      data.forEach(cliente => {
        selectCliente.innerHTML += `<option value="${cliente.id}">${cliente.id} - ${cliente.nombre} - ${cliente.numero_documento}</option>`;
      });
    });

  document.getElementById('buscar-form').addEventListener('submit', function(e){
    e.preventDefault();

    clienteId = selectCliente.value;

    fetch(`/api/clientes/api/clientes/${clienteId}`)
      .then(res => res.json())
      .then(cliente => {
        if (cliente.error) throw new Error(cliente.error);

        document.getElementById('editar-form').classList.remove('d-none');
        document.getElementById('tipo_documento').value = cliente.tipo_documento;
        document.getElementById('numero_documento').value = cliente.numero_documento;
        document.getElementById('nombre').value = cliente.nombre;
        document.getElementById('direccion').value = cliente.direccion;
        document.getElementById('telefono').value = cliente.telefono;
        document.getElementById('email').value = cliente.email;
        document.getElementById('password').value = cliente.password;

        const mensaje = document.getElementById('mensaje');
        mensaje.className = 'alert alert-info mt-4';
        mensaje.textContent = 'Cliente cargado correctamente';
        mensaje.classList.remove('d-none');
      })
      .catch(error => {
        const mensaje = document.getElementById('mensaje');
        mensaje.className = 'alert alert-danger mt-4';
        mensaje.textContent = 'No fue posible cargar el cliente';
        mensaje.classList.remove('d-none');
        console.error(error);
      });
  });

  document.getElementById('editar-form').addEventListener('submit', function(e){
    e.preventDefault();

    const cliente = {
      tipo_documento: document.getElementById('tipo_documento').value,
      numero_documento: document.getElementById('numero_documento').value,
      nombre: document.getElementById('nombre').value,
      direccion: document.getElementById('direccion').value,
      telefono: document.getElementById('telefono').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };

    fetch(`/api/clientes/api/clientes/${clienteId}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(cliente)
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) throw new Error(data.error);

      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'alert alert-success mt-4';
      mensaje.textContent = 'Cliente actualizado correctamente';
      mensaje.classList.remove('d-none');
    })
    .catch(error => {
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'alert alert-danger mt-4';
      mensaje.textContent = 'Error al actualizar el cliente';
      mensaje.classList.remove('d-none');
      console.error(error);
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
