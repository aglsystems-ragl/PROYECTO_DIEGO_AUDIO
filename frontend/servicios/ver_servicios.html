<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ver Servicios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      background: linear-gradient(135deg, #f4f6f9, #e9eef5);
      min-height: 100vh;
    }

    .navbar-brand{
      font-weight: 600;
      font-size: 1.8rem;
    }

    .hero-card{
      border: none;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      margin-top: 30px;
    }

    .hero-img{
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .content-card{
      border: none;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-top: 25px;
    }

    .table thead th{
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavVer">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavVer">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="ver_servicios.html">Ver Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="insertar_servicio.html">Insertar</a></li>
          <li class="nav-item"><a class="nav-link" href="consultar_servicio.html">Consultar</a></li>
          <li class="nav-item"><a class="nav-link" href="editar_servicio.html">Editar</a></li>
          <li class="nav-item"><a class="nav-link" href="borrar_servicio.html">Eliminar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="card hero-card">
      <img src="../imagenes/banner_audio.jpg" alt="Banner Diego Arenas Audio" class="hero-img">
      <div class="card-body text-center">
        <h2 class="mb-2">Lista de Servicios</h2>
        <p class="text-muted mb-0">
          Consulta el catálogo actual del estudio con sus precios y descripciones.
        </p>
      </div>
    </div>

    <div class="card content-card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Descripción</th>
              </tr>
            </thead>
            <tbody id="servicios-table-body"></tbody>
          </table>
        </div>

        <div id="mensaje" class="alert alert-danger d-none mt-3"></div>

        <div class="text-center mt-4">
          <a href="index.html" class="btn btn-secondary">Volver</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/servicios/api/servicios')
      .then(response => response.json())
      .then(data => {
        const tableBody = document.getElementById('servicios-table-body');

        data.forEach(servicio => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${servicio.id}</td>
            <td>${servicio.nombre}</td>
            <td>$${servicio.precio}</td>
            <td>${servicio.descripcion}</td>
          `;
          tableBody.appendChild(row);
        });
      })
      .catch(error => {
        const mensaje = document.getElementById('mensaje');
        mensaje.classList.remove('d-none');
        mensaje.textContent = 'Error al cargar la lista de servicios';
        console.error('Error:', error);
      });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
