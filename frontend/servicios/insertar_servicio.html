<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Insertar Servicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      background: linear-gradient(135deg, #f4f6f9, #e9eef5);
      min-height: 100vh;
    }

    .navbar-brand{
      font-weight: 600;
      font-size: 1.8rem;
    }

    .hero-card{
      border: none;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      margin-top: 30px;
    }

    .hero-img{
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .content-card{
      border: none;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-top: 25px;
    }

    .form-control, .form-select, textarea{
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavInsertar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavInsertar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="ver_servicios.html">Ver Servicios</a></li>
          <li class="nav-item"><a class="nav-link active" href="insertar_servicio.html">Insertar</a></li>
          <li class="nav-item"><a class="nav-link" href="consultar_servicio.html">Consultar</a></li>
          <li class="nav-item"><a class="nav-link" href="editar_servicio.html">Editar</a></li>
          <li class="nav-item"><a class="nav-link" href="borrar_servicio.html">Eliminar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="card hero-card">
      <img src="../imagenes/banner_audio.jpg" alt="Banner Diego Arenas Audio" class="hero-img">
      <div class="card-body text-center">
        <h2 class="mb-2">Insertar Nuevo Servicio</h2>
        <p class="text-muted mb-0">
          Registra un nuevo servicio del estudio con nombre, precio y descripción.
        </p>
      </div>
    </div>

    <div class="card content-card">
      <div class="card-body p-4">
        <form id="servicio-form">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del servicio</label>
            <input type="text" class="form-control" id="nombre" required />
          </div>

          <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" id="precio" required />
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="4" required></textarea>
          </div>

          <button type="submit" class="btn btn-success">Guardar</button>
          <a href="index.html" class="btn btn-secondary ms-2">Volver</a>
        </form>

        <div id="mensaje" class="alert mt-4 d-none"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('servicio-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const precio = document.getElementById('precio').value;
      const descripcion = document.getElementById('descripcion').value;

      fetch('/api/servicios/api/servicios', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ nombre, precio, descripcion })
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          throw new Error(data.error);
        }

        const mensaje = document.getElementById('mensaje');
        mensaje.classList.remove('d-none', 'alert-danger');
        mensaje.classList.add('alert', 'alert-success');
        mensaje.textContent = 'Servicio insertado con éxito';

        document.getElementById('servicio-form').reset();
      })
      .catch(error => {
        const mensaje = document.getElementById('mensaje');
        mensaje.classList.remove('d-none', 'alert-success');
        mensaje.classList.add('alert', 'alert-danger');
        mensaje.textContent = 'Error al insertar el servicio';
        console.error(error);
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
