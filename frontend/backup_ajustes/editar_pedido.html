<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#eef2ff,#f8fafc);
    }

    .navbar-brand{
      font-weight:700;
      font-size:1.7rem;
    }

    .banner-sistema{
      background:url('../imagenes/banner_audio.jpg') center/cover no-repeat;
      height:220px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      text-shadow:2px 2px 6px rgba(0,0,0,0.7);
      font-size:2rem;
      font-weight:700;
    }

    .hero-card,
    .content-card{
      border:none;
      border-radius:20px;
      box-shadow:0 12px 28px rgba(0,0,0,0.1);
    }

    .hero-card{
      overflow:hidden;
      margin-top:28px;
    }

    .hero-img{
      width:100%;
      height:260px;
      object-fit:cover;
    }

    .servicio-item{
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:14px;
      margin-bottom:12px;
      background:#fff;
    }

    .total-box{
      background:#fff7ed;
      border:1px solid #fdba74;
      border-radius:16px;
      padding:18px;
      font-size:1.1rem;
    }

    .form-select,
    .form-control{
      border-radius:12px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarEditarPedido">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarEditarPedido">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="ver_pedidos.html">Ver Pedidos</a></li>
        <li class="nav-item"><a class="nav-link" href="insertar_pedido.html">Crear Pedido</a></li>
        <li class="nav-item"><a class="nav-link" href="consultar_pedido.html">Consultar</a></li>
        <li class="nav-item"><a class="nav-link active" href="editar_pedido.html">Editar</a></li>
        <li class="nav-item"><a class="nav-link" href="borrar_pedido.html">Eliminar</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="banner-sistema">
  Sistema de Gestión de Pedidos - Editar Pedido
</div>

<div class="container pb-5">
  <div class="hero-card">
    <img src="../imagenes/editar_pedido.jpg" alt="Editar pedido" class="hero-img">
    <div class="p-4 text-center bg-white">
      <h2>Editar Pedido</h2>
      <p class="text-muted mb-0">
        Carga un pedido existente, modifica cliente o servicios y recalcula el total.
      </p>
    </div>
  </div>

  <div class="content-card bg-white mt-4 p-4">
    <form id="buscar-form" class="mb-4">
      <label class="form-label">Seleccione un pedido</label>
      <select id="id_pedido" class="form-select mb-3" required>
        <option value="">Cargando pedidos...</option>
      </select>

      <button type="submit" class="btn btn-primary">Cargar pedido</button>
      <a href="index.html" class="btn btn-secondary ms-2">Volver</a>
    </form>

    <form id="editar-form" class="d-none">
      <div class="mb-4">
        <label class="form-label">Cliente</label>
        <select id="id_cliente" class="form-select" required>
          <option value="">Cargando clientes...</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label">Servicios disponibles</label>
        <div id="lista-servicios"></div>
      </div>

      <div class="total-box mb-4">
        <strong>Total actualizado:</strong>
        <span id="total-pedido">$0</span>
      </div>

      <button type="submit" class="btn btn-warning">Actualizar pedido</button>
      <a href="index.html" class="btn btn-secondary ms-2">Volver</a>
    </form>

    <div id="mensaje" class="alert mt-4 d-none"></div>
  </div>
</div>

<script>
  let pedidoActual = null;
  let serviciosDisponibles = [];
  let clientesDisponibles = [];

  function actualizarTotal() {
    const checks = document.querySelectorAll('.check-servicio:checked');
    let total = 0;

    checks.forEach(check => {
      total += parseFloat(check.dataset.precio);
    });

    document.getElementById('total-pedido').textContent = `$${total.toLocaleString('es-CO')}`;
  }

  function renderServiciosSeleccionados(serviciosPedido) {
    const idsSeleccionados = Array.isArray(serviciosPedido)
      ? serviciosPedido.map(s => Number(s.id))
      : [];

    const contenedor = document.getElementById('lista-servicios');
    contenedor.innerHTML = '';

    serviciosDisponibles.forEach(servicio => {
      const marcado = idsSeleccionados.includes(Number(servicio.id)) ? 'checked' : '';
      const div = document.createElement('div');
      div.className = 'servicio-item';
      div.innerHTML = `
        <div class="form-check">
          <input class="form-check-input check-servicio" type="checkbox" value="${servicio.id}" data-precio="${servicio.precio}" id="servicio_${servicio.id}" ${marcado}>
          <label class="form-check-label" for="servicio_${servicio.id}">
            <strong>${servicio.nombre}</strong> - $${Number(servicio.precio).toLocaleString('es-CO')}<br>
            <small class="text-muted">${servicio.descripcion}</small>
          </label>
        </div>
      `;
      contenedor.appendChild(div);
    });

    document.querySelectorAll('.check-servicio').forEach(check => {
      check.addEventListener('change', actualizarTotal);
    });

    actualizarTotal();
  }

  fetch('/api/pedidos/api/pedidos')
    .then(res => res.json())
    .then(data => {
      const select = document.getElementById('id_pedido');
      select.innerHTML = '<option value="">Seleccione un pedido...</option>';
      data.forEach(pedido => {
        select.innerHTML += `<option value="${pedido.id}">Pedido #${pedido.id} - ${pedido.nombre_cliente}</option>`;
      });
    });

  fetch('/api/clientes/api/clientes')
    .then(res => res.json())
    .then(data => {
      clientesDisponibles = data;
      const select = document.getElementById('id_cliente');
      select.innerHTML = '<option value="">Seleccione un cliente...</option>';
      data.forEach(cliente => {
        select.innerHTML += `<option value="${cliente.id}">${cliente.id} - ${cliente.nombre} - ${cliente.numero_documento}</option>`;
      });
    });

  fetch('/api/servicios/api/servicios')
    .then(res => res.json())
    .then(data => {
      serviciosDisponibles = data;
    });

  document.getElementById('buscar-form').addEventListener('submit', function(e){
    e.preventDefault();

    const id = document.getElementById('id_pedido').value;

    fetch(`/api/pedidos/api/pedidos/${id}`)
      .then(res => res.json())
      .then(pedido => {
        if (pedido.error) throw new Error(pedido.error);

        pedidoActual = pedido;
        document.getElementById('editar-form').classList.remove('d-none');
        document.getElementById('id_cliente').value = pedido.id_cliente;
        renderServiciosSeleccionados(pedido.servicios_seleccionados);

        const mensaje = document.getElementById('mensaje');
        mensaje.className = 'alert alert-info mt-4';
        mensaje.textContent = 'Pedido cargado correctamente';
        mensaje.classList.remove('d-none');
      })
      .catch(error => {
        const mensaje = document.getElementById('mensaje');
        mensaje.className = 'alert alert-danger mt-4';
        mensaje.textContent = 'No fue posible cargar el pedido';
        mensaje.classList.remove('d-none');
        console.error(error);
      });
  });

  document.getElementById('editar-form').addEventListener('submit', function(e){
    e.preventDefault();

    const id_cliente = document.getElementById('id_cliente').value;
    const servicios = Array.from(document.querySelectorAll('.check-servicio:checked')).map(check => Number(check.value));

    if (!id_cliente || servicios.length === 0) {
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'alert alert-warning mt-4';
      mensaje.textContent = 'Debes seleccionar un cliente y al menos un servicio.';
      mensaje.classList.remove('d-none');
      return;
    }

    fetch(`/api/pedidos/api/pedidos/${pedidoActual.id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        id_cliente: Number(id_cliente),
        servicios
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.error) throw new Error(data.error);

      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'alert alert-success mt-4';
      mensaje.textContent = 'Pedido actualizado correctamente';
      mensaje.classList.remove('d-none');
    })
    .catch(error => {
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'alert alert-danger mt-4';
      mensaje.textContent = 'Error al actualizar el pedido';
      mensaje.classList.remove('d-none');
      console.error(error);
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
