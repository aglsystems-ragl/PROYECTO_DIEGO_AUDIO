<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Pagos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);}
    .navbar-brand{font-weight:700;font-size:1.7rem;}
    .hero-card,.content-card{border:none;border-radius:20px;box-shadow:0 12px 28px rgba(0,0,0,0.1);}
    .hero-card{overflow:hidden;margin-top:28px;}
    .hero-img{width:100%;height:250px;object-fit:cover;}
    .pago-card{
      border:1px solid #e5e7eb;
      border-radius:18px;
      padding:18px;
      margin-bottom:18px;
      background:#fff;
      box-shadow:0 6px 16px rgba(0,0,0,0.05);
    }
    .badge-servicio{
      background:#e0f2fe;
      color:#0369a1;
      border-radius:999px;
      padding:6px 10px;
      display:inline-block;
      margin:4px 6px 0 0;
      font-size:.9rem;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">🎵 Diego Arenas Audio</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarVerPagos">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarVerPagos">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="registrar_pago.html">Registrar Pago</a></li>
        <li class="nav-item"><a class="nav-link active" href="ver_pagos.html">Ver Pagos</a></li>
        <li class="nav-item"><a class="nav-link" href="consultar_pago.html">Consultar Pago</a></li>
        <li class="nav-item"><a class="nav-link" href="borrar_pago.html">Eliminar Pago</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  <div class="hero-card">
    <img src="../imagenes/ver_pagos.jpg" alt="Ver pagos" class="hero-img">
    <div class="p-4 text-center bg-white">
      <h2>Pagos Registrados</h2>
      <p class="text-muted mb-0">Consulta todos los pagos con referencia, estado y descarga del PDF.</p>
    </div>
  </div>

  <div class="content-card bg-white mt-4 p-4">
    <div id="lista-pagos"></div>
    <div id="mensaje" class="alert alert-danger d-none mt-3"></div>
    <div class="text-center mt-4">
      <a href="index.html" class="btn btn-secondary">Volver</a>
    </div>
  </div>
</div>

<script>
  function renderServicios(servicios) {
    if (!Array.isArray(servicios)) return '';
    return servicios.map(s => `<span class="badge-servicio">${s.nombre} - $${Number(s.precio).toLocaleString('es-CO')}</span>`).join('');
  }

  fetch('/api/pagos')
    .then(res => res.json())
    .then(data => {
      const contenedor = document.getElementById('lista-pagos');

      if (!Array.isArray(data) || data.length === 0) {
        contenedor.innerHTML = '<p class="text-center text-muted">No hay pagos registrados.</p>';
        return;
      }

      data.forEach(pago => {
        const div = document.createElement('div');
        div.className = 'pago-card';
        div.innerHTML = `
          <h5 class="fw-bold">Pago #${pago.id}</h5>
          <p class="mb-1"><strong>Referencia:</strong> ${pago.referencia_pago || 'Sin referencia'}</p>
          <p class="mb-1"><strong>Pedido:</strong> ${pago.id_pedido}</p>
          <p class="mb-1"><strong>Cliente:</strong> ${pago.nombre_cliente}</p>
          <p class="mb-1"><strong>Email:</strong> ${pago.email_cliente}</p>
          <p class="mb-1"><strong>Método:</strong> ${pago.metodo_pago}</p>
          <p class="mb-1"><strong>Estado:</strong> ${pago.estado}</p>
          <p class="mb-2"><strong>Fecha de pago:</strong> ${pago.fecha_pago}</p>
          <p class="mb-2"><strong>Servicios:</strong></p>
          <div class="mb-3">${renderServicios(pago.detalle_servicios)}</div>
          <p class="mb-3"><strong>Total:</strong> $${Number(pago.total_pago).toLocaleString('es-CO')}</p>
          <a href="${pago.ruta_comprobante}" target="_blank" class="btn btn-outline-primary">          
           Descargar PDF
          </a>
        `;
        contenedor.appendChild(div);
      });
    })
    .catch(error => {
      const mensaje = document.getElementById('mensaje');
      mensaje.classList.remove('d-none');
      mensaje.textContent = 'Error al cargar los pagos';
      console.error(error);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
